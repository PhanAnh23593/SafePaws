spring.application.name=auth-service
spring.config.import=optional:file:./.env[.properties]
spring.profiles.default=local

# Database credentials come from environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.deserialization.fail-on-unknown-properties=true
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

auth.jwt-secret-base64=${JWT_SECRET_BASE64}
auth.jwt-issuer=${JWT_ISSUER:zippy-auth}
auth.access-expiration-seconds=${JWT_ACCESS_EXPIRATION_SECONDS:900}
auth.refresh-expiration-seconds=${REFRESH_TOKEN_EXPIRATION_SECONDS:604800}
auth.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:}
auth.google.client-ids=${GOOGLE_CLIENT_IDS:}
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
auth.mail.from=${MAIL_FROM:}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s
server.error.include-binding-errors=never
