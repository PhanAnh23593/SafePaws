<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} | SafePaws</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f5f9;color:#172033;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" style="width:100%;border-collapse:collapse;background-color:#f3f5f9;">
        <tr>
            <td align="center" style="padding:40px 16px;">
                <table role="presentation" style="width:100%;max-width:560px;border-collapse:collapse;background-color:#ffffff;border:1px solid #e3e8f0;">
                    <tr>
                        <td style="padding:28px 32px;background-color:#2449db;color:#ffffff;font-size:28px;font-weight:bold;">SafePaws</td>
                    </tr>
                    <tr>
                        <td style="padding:32px;">
                            <h1 style="margin:0 0 16px;font-size:24px;line-height:1.4;color:#172033;">{{title}}</h1>
                            <p style="margin:0 0 24px;font-size:16px;line-height:1.7;color:#475569;">{{description}}</p>
                            <table role="presentation" style="width:100%;border-collapse:collapse;">
                                <tr>
                                    <td align="center" style="padding:24px 12px;background-color:#eef2ff;border:1px solid #dbe3ff;">
                                        <p style="margin:0 0 12px;font-size:12px;font-weight:bold;letter-spacing:2px;color:#475569;">MÃ XÁC MINH</p>
                                        <p style="margin:0;font-family:'Courier New',monospace;font-size:36px;font-weight:bold;letter-spacing:6px;line-height:1.4;color:#2449db;">{{otp}}</p>
                                    </td>
                                </tr>
                            </table>
                            <p style="margin:24px 0 12px;font-size:15px;line-height:1.7;color:#475569;">Mã có hiệu lực trong <strong>3 phút</strong>. Không chia sẻ mã này với bất kỳ ai.</p>
                            <p style="margin:0;font-size:14px;line-height:1.7;color:#64748b;">Nếu bạn không thực hiện yêu cầu này, hãy bỏ qua email.</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:20px 32px;border-top:1px solid #e3e8f0;font-size:12px;line-height:1.7;color:#64748b;">Email tự động từ SafePaws. Vui lòng không trả lời email này.</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
